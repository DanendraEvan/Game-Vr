<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <title>Sosio Metaverse - Misi Angket</title>
    <meta name="description" content="Misi Angket - Game VR dengan Three.js" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Three.js Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <!-- NippleJS for Virtual Joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            background: #222;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 5px;
            z-index: 999;
            white-space: pre-line;
        }

        #game-ui {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            z-index: 1000;
            min-width: 200px;
            display: none;
        }

        #start-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        .btn:hover {
            background: #45a049;
        }

        .btn-secondary {
            background: #f44336;
        }

        .btn-secondary:hover {
            background: #da190b;
        }

        #result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .result-content {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 600px;
        }

        .result-image {
            width: 100%;
            max-width: 450px;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            margin: 20px 0;
            cursor: zoom-in;
        }

        .btn-download {
            background: #2196F3;
        }

        .btn-download:hover {
            background: #0b7dda;
        }

        #zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            cursor: zoom-out;
        }

        #zoomed-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            color: white;
        }

        .loading-spinner {
            border: 4px solid #333;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            text-align: center;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            z-index: 1000;
            pointer-events: none;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 1px;
        }

        .crosshair-horizontal {
            width: 20px;
            height: 2px;
            top: 9px;
            left: 0;
        }

        .crosshair-vertical {
            width: 2px;
            height: 20px;
            top: 0;
            left: 9px;
        }

        .crosshair-center {
            width: 4px;
            height: 4px;
            background: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            top: 8px;
            left: 8px;
        }

        #joystick-zone {
            position: fixed;
            bottom: 80px;
            left: 80px;
            width: 120px;
            height: 120px;
            z-index: 1001;
            display: none; /* Hidden by default */
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading Assets...</p>
        <div id="loading-progress">0%</div>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" style="display: none;">
        <div class="modal-content">
            <h2>🎯 Misi Angket</h2>
            <p>Sebarkan angket ke sebanyak mungkin rumah dalam waktu 60 detik!<br>
                Target: 20 rumah untuk hasil sempurna.</p>
            <button class="btn" onclick="startGame()">Mulai Misi</button>
            <button class="btn btn-secondary" onclick="goBack()">Kembali</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal">
        <div class="result-content">
            <h2 id="result-title">Hasil Misi</h2>
            <img id="result-img" class="result-image" src="" alt="Hasil">
            <p id="result-text"></p>
            <button class="btn" onclick="restartGame()">Main Lagi</button>
            <button class="btn btn-download" onclick="downloadResult()">Unduh Hasil</button>
            <button class="btn btn-secondary" onclick="goBack()">Kembali</button>
        </div>
    </div>

    <!-- Zoom Modal -->
    <div id="zoom-overlay" onclick="this.style.display='none'">
        <img id="zoomed-img" src="" alt="Hasil Zoom">
    </div>

    <!-- HUD Koordinat -->
    <div id="hud">Koordinat: X: 0.00 Y: 0.00 Z: 0.00</div>

    <!-- Game UI -->
    <div id="game-ui">
        <div id="timer-display">⏰ Waktu: <span id="timer">60</span>s</div>
        <div id="score-display">📊 Skor: <span id="score">0</span>/20</div>
        <div id="progress-bar" style="width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 10px;">
            <div id="progress-fill" style="width: 0%; height: 100%; background: #4CAF50; border-radius: 5px; transition: width 0.3s;"></div>
        </div>
    </div>

    <!-- Instructions -->
    <div id="instructions"></div>

    <!-- Crosshair -->
    <div id="crosshair">
        <div class="crosshair-line crosshair-horizontal"></div>
        <div class="crosshair-line crosshair-vertical"></div>
        <div class="crosshair-line crosshair-center"></div>
    </div>

    <!-- Joystick Zone -->
    <div id="joystick-zone"></div>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        // **Three.js Setup**
        let scene, camera, renderer, controls;
        let raycaster, mouse, intersects;
        let clock = new THREE.Clock();
        
        // **Device Detection**
        const isMobile = 'ontouchstart' in window;

        // **Game State Management** 
        let gameState = {
            isMobile: isMobile,
            vrMode: false,
            gameActive: false,
            score: 0,
            timeLeft: 60,
            timer: null,
            totalPoints: 20,
            clickedPoints: new Set(),
            surveyPoints: [],
            loadingComplete: false,
            moveVector: new THREE.Vector3(), // For joystick
            touchLook: { // For touch-to-look
                active: false,
                id: -1,
                lastX: 0,
                lastY: 0,
                startX: 0,
                startY: 0,
                startTime: 0
            }
        };

        // **Survey Point Positions** (dari kode asli)
        const surveyPointPositions = [
            // Baris 1
            [-8.482, 1.5, -8], [-8.482, 1.5, -29.280], [-8.482, 1.5, -51.024],
            // Baris 2
            [13.795, 1.5, -21.217], [30.756, 1.5, -21.217], [47.589, 1.5, -21.217],
            // Baris 3
            [13.846, 1.5, -54.406], [30.797, 1.5, -54.406], [47.522, 1.5, -54.406],
            // Baris 4
            [-29.507, 1.5, -67.162], [-46.214, 1.5, -67.162], [-63.172, 1.5, -67.162],
            [11.115, 1.5, -87.642],
            // Baris 5
            [-1.361, 1.5, -121.689], [15.629, 1.5, -121.689], [-18.094, 1.5, -121.689],
            [30.608, 1.5, -139.373],
            // Baris 6
            [67.989, 1.5, -148.761], [84.628, 1.5, -148.451], [101.699, 1.5, -148.041],
            // Baris 7
            [24.938, 1.5, -162.371], [8.048, 1.5, -162.693], [-8.864, 1.5, -163.023],
            // Baris 8
            [-7.957, 1.5, -196.262], [8.658, 1.5, -195.948], [25.651, 1.5, -195.647],
            [48.190, 1.5, -208.372], [47.723, 1.5, -187.055], [47.292, 1.5, -165.246]
        ];

        // **Initialize Three.js**
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ'; // Use YXZ order for FPS-style controls to avoid roll
            camera.position.set(-4, 3.6, 15);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            if (!isMobile) {
                controls = new THREE.PointerLockControls(camera, document.body);
                scene.add(controls.getObject());
            } else {
                // On mobile, we control the camera rotation manually
                controls = { getObject: () => camera }; 
            }

            // Raycaster for mouse picking
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting
            setupLighting();
            
            // Load Assets
            loadAssets();
            
            // Event Listeners
            setupEventListeners();
            
            // Start render loop
            animate();
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x808080, 0.5);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-1, 2, 1);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
        }

        function loadAssets() {
            const loadingManager = new THREE.LoadingManager();
            const gltfLoader = new THREE.GLTFLoader(loadingManager);
            
            loadingManager.onProgress = (url, loaded, total) => {
                const progress = Math.round((loaded / total) * 100);
                document.getElementById('loading-progress').textContent = progress + '%';
            };
            
            loadingManager.onLoad = () => {
                gameState.loadingComplete = true;
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('start-modal').style.display = 'flex';
                createInfoDialog();
                createSurveyPoints();
            };
            
            loadingManager.onError = (url) => {
                console.warn('Failed to load:', url);
                createFallbackEnvironment();
                gameState.loadingComplete = true;
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('start-modal').style.display = 'flex';
                createInfoDialog();
                createSurveyPoints();
            };

            gltfLoader.load('models/perumahan.glb', (gltf) => {
                const model = gltf.scene;
                model.scale.set(2, 2, 2);
                model.position.set(0, 0, 0);
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(model);
            }, undefined, (error) => {
                console.warn('Failed to load main model, creating fallback');
                createFallbackEnvironment();
            });

            gltfLoader.load('models/sky_dome_demo.glb', (gltf) => {
                const skyDome = gltf.scene;
                skyDome.scale.set(18, 18, 18);
                skyDome.position.set(0, 0, 0);
                scene.add(skyDome);
            }, undefined, (error) => {
                console.warn('Failed to load sky dome, using color background');
            });
        }

        function createFallbackEnvironment() {
            const buildingGeo = new THREE.BoxGeometry(4, 6, 4);
            const buildingMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const buildingPositions = [
                [-8, 0, -8], [-8, 0, -29], [-8, 0, -51], [14, 0, -21], [31, 0, -21], [48, 0, -21],
                [14, 0, -54], [31, 0, -54], [48, 0, -54], [-30, 0, -67], [-46, 0, -67], [-63, 0, -67],
                [11, 0, -88], [-1, 0, -122], [16, 0, -122], [-18, 0, -122], [31, 0, -139], [68, 0, -149],
                [85, 0, -148], [102, 0, -148]
            ];
            buildingPositions.forEach(pos => {
                const building = new THREE.Mesh(buildingGeo, buildingMat);
                building.position.set(pos[0], pos[1] + 3, pos[2]);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            });
            const groundGeo = new THREE.PlaneGeometry(400, 400);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createInfoDialog() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 550;
            canvas.height = 128;
            context.fillStyle = '#1e293b';
            context.fillRect(0, 0, 550, 128);
            context.fillStyle = 'white';
            context.font = '20px Arial';
            context.textAlign = 'center';
            context.fillText('Misi Angket: Klik titik-titik merah untuk menyebarkan angket!', 256, 40);
            context.fillText('Target 20 rumah dalam 60 detik.', 256, 70);
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshBasicMaterial({ map: texture });
            const geometry = new THREE.PlaneGeometry(18, 4.5);
            const infoPanel = new THREE.Mesh(geometry, material);
            infoPanel.position.set(0, 8, 0);
            scene.add(infoPanel);
        }

        function createSurveyPoints() {
            gameState.surveyPoints = [];
            surveyPointPositions.forEach((pos, index) => {
                const geometry = new THREE.SphereGeometry(0.3, 16, 16);
                const material = new THREE.MeshLambertMaterial({ color: 0xff4444, emissive: 0xff2222, emissiveIntensity: 0.3 });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(pos[0], pos[1], pos[2]);
                sphere.userData = { index: index, isClickable: true, type: 'survey-point', clicked: false };
                scene.add(sphere);
                gameState.surveyPoints.push(sphere);
            });
        }

        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize);
            
            const instructions = document.getElementById('instructions');
            if (isMobile) {
                instructions.innerHTML = "Analog Kiri: Gerak | Geser Kanan: Lihat | Ketuk Target: Klik";
                setupTouchControls();
            } else {
                instructions.innerHTML = "WASD: Gerak | Mouse: Lihat | Click: Klik Titik Angket | ESC: Keluar";
                setupDesktopControls();
            }
        }

        function setupDesktopControls() {
            const moveState = { forward: false, backward: false, left: false, right: false };
            
            window.addEventListener('keydown', (event) => {
                switch(event.code) {
                    case 'KeyW': moveState.forward = true; break;
                    case 'KeyS': moveState.backward = true; break;
                    case 'KeyA': moveState.left = true; break;
                    case 'KeyD': moveState.right = true; break;
                    case 'Escape':
                        if (gameState.gameActive && controls.isLocked) {
                            if (confirm('Apakah Anda yakin ingin mengakhiri misi?')) endGame();
                        }
                        break;
                }
            });
            
            window.addEventListener('keyup', (event) => {
                switch(event.code) {
                    case 'KeyW': moveState.forward = false; break;
                    case 'KeyS': moveState.backward = false; break;
                    case 'KeyA': moveState.left = false; break;
                    case 'KeyD': moveState.right = false; break;
                }
            });

            document.addEventListener('click', () => {
                if (gameState.gameActive && !controls.isLocked) controls.lock();
                else if (gameState.gameActive) onMouseClick();
            });

            gameState.updateMovement = () => {
                if (!controls.isLocked) return;
                const velocity = new THREE.Vector3();
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();
                if (moveState.forward) velocity.add(direction);
                if (moveState.backward) velocity.sub(direction);
                if (moveState.left) velocity.add(new THREE.Vector3().crossVectors(camera.up, direction).normalize());
                if (moveState.right) velocity.sub(new THREE.Vector3().crossVectors(camera.up, direction).normalize());
                
                const player = controls.getObject();
                player.position.x += velocity.x * 0.3;
                player.position.z += velocity.z * 0.3;
                player.position.y = 1.6; // Ground constraint
                player.position.x = Math.max(-100, Math.min(360, player.position.x));
                player.position.z = Math.max(-200, Math.min(200, player.position.z));
            };
        }

        function setupTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            joystickZone.style.display = 'block';

            const joystick = nipplejs.create({
                zone: joystickZone,
                mode: 'static',
                position: { left: '50%', top: '50%' },
                color: 'white',
                size: 120
            }).on('move', (evt, data) => {
                const angle = data.angle.radian;
                const force = data.force;
                // Corrected mapping: Y from joystick vector for forward/backward, X for strafe
                gameState.moveVector.set(data.vector.x, 0, data.vector.y).multiplyScalar(force);
            }).on('end', () => {
                gameState.moveVector.set(0, 0, 0);
            });

            const canvas = renderer.domElement;
            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd);

            gameState.updateMovement = () => {
                if (!gameState.gameActive) return;
                const player = controls.getObject();
                const forward = new THREE.Vector3();
                player.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();

                // Corrected right vector calculation
                const right = new THREE.Vector3().crossVectors(forward, player.up).normalize();
                
                const moveDir = new THREE.Vector3();
                // Correctly apply joystick vectors to camera-relative directions
                const moveZ = forward.clone().multiplyScalar(gameState.moveVector.z);
                const moveX = right.clone().multiplyScalar(gameState.moveVector.x);
                
                moveDir.add(moveZ).add(moveX);

                player.position.add(moveDir.multiplyScalar(0.2));
                player.position.y = 1.6; // Ground constraint
                player.position.x = Math.max(-100, Math.min(360, player.position.x));
                player.position.z = Math.max(-200, Math.min(200, player.position.z));
            };
        }

        function onTouchStart(event) {
            event.preventDefault();
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                // If touch is on the right side of the screen, and no look touch is active
                if (touch.clientX > window.innerWidth / 2 && gameState.touchLook.id === -1) {
                    gameState.touchLook.id = touch.identifier;
                    gameState.touchLook.lastX = touch.clientX;
                    gameState.touchLook.lastY = touch.clientY;
                    gameState.touchLook.startX = touch.clientX;
                    gameState.touchLook.startY = touch.clientY;
                    gameState.touchLook.startTime = performance.now();
                    gameState.touchLook.active = true;
                }
            }
        }

        function onTouchMove(event) {
            event.preventDefault();
            if (!gameState.touchLook.active) return;
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.identifier === gameState.touchLook.id) {
                    const deltaX = touch.clientX - gameState.touchLook.lastX;
                    const deltaY = touch.clientY - gameState.touchLook.lastY;
                    gameState.touchLook.lastX = touch.clientX;
                    gameState.touchLook.lastY = touch.clientY;

                    camera.rotation.y -= deltaX * 0.005;
                    camera.rotation.x -= deltaY * 0.005;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                }
            }
        }

        function onTouchEnd(event) {
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.identifier === gameState.touchLook.id) {
                    const touchDuration = performance.now() - gameState.touchLook.startTime;
                    const touchDistance = Math.sqrt(
                        Math.pow(touch.clientX - gameState.touchLook.startX, 2) +
                        Math.pow(touch.clientY - gameState.touchLook.startY, 2)
                    );

                    // Differentiate between a tap and a drag
                    if (touchDuration < 200 && touchDistance < 10) {
                        onMouseClick(); // It's a tap, so trigger a click
                    }

                    // Deactivate look controls
                    gameState.touchLook.id = -1;
                    gameState.touchLook.active = false;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseClick(event) {
            if (!gameState.gameActive) return;
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); // Raycast from center
            const intersects = raycaster.intersectObjects(gameState.surveyPoints);
            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;
                const index = clickedObject.userData.index;
                if (clickedObject.userData.isClickable && !gameState.clickedPoints.has(index)) {
                    handlePointClick(clickedObject, index);
                }
            }
        }

        function handlePointClick(point, index) {
            gameState.clickedPoints.add(index);
            gameState.score++;
            point.userData.clicked = true;
            point.material.color.setHex(0x4CAF50);
            point.material.emissive.setHex(0x2E7D32);
            
            const startScale = point.scale.clone();
            const targetScale = new THREE.Vector3(1.2, 1.2, 1.2);
            let animationTime = 0;
            const animateClick = () => {
                animationTime += 0.1;
                if (animationTime < 1) {
                    point.scale.lerpVectors(startScale, targetScale, Math.sin(animationTime * Math.PI));
                    requestAnimationFrame(animateClick);
                } else {
                    point.visible = false;
                }
            };
            animateClick();
            playClickSound();
            updateUI();
            if (gameState.score >= gameState.totalPoints) {
                endGame();
            }
        }

        function updateUI() {
            document.getElementById('timer').textContent = gameState.timeLeft;
            document.getElementById('score').textContent = gameState.score;
            const progress = (gameState.score / gameState.totalPoints) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            const timerDisplay = document.getElementById('timer-display');
            if (gameState.timeLeft <= 10) timerDisplay.style.color = '#ff4444';
            else if (gameState.timeLeft <= 20) timerDisplay.style.color = '#ff9800';
            else timerDisplay.style.color = '#fff';
        }

        function updateHUD() {
            const pos = controls.getObject().position;
            document.getElementById('hud').innerText = `Koordinat:
X: ${pos.x.toFixed(2)}
Y: ${pos.y.toFixed(2)}
Z: ${pos.z.toFixed(2)}`;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameState.updateMovement) {
                gameState.updateMovement();
            }
            updateHUD();
            
            if (gameState.gameActive) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(gameState.surveyPoints);
                let hovered = false;
                gameState.surveyPoints.forEach(point => {
                    if (!point.userData.clicked && point.visible) {
                        const isHovered = intersects.some(intersect => intersect.object === point);
                        if (isHovered) hovered = true;
                        const targetScale = isHovered ? 1.2 : 1.0;
                        point.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                    }
                });
                const crosshairCenter = document.querySelector('.crosshair-center');
                if (hovered) {
                    crosshairCenter.style.background = 'rgba(0, 255, 0, 0.9)';
                } else {
                    crosshairCenter.style.background = 'rgba(255, 0, 0, 0.7)';
                }
            }
            renderer.render(scene, camera);
        }

        function startGame() {
            document.getElementById('start-modal').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';

            gameState.gameActive = true;
            gameState.score = 0;
            gameState.timeLeft = 60;
            gameState.clickedPoints.clear();

            gameState.surveyPoints.forEach(point => {
                point.visible = true;
                point.material.color.setHex(0xff4444);
                point.material.emissive.setHex(0xff2222);
                point.userData.clicked = false;
                point.scale.set(1, 1, 1);
            });

            updateUI();
            startTimer();
            
            if (isMobile) {
                 document.getElementById('joystick-zone').style.display = 'block';
            } else {
                controls.lock();
            }
            controls.getObject().position.y = 1.6;
        }

        function startTimer() {
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                updateUI();
                if (gameState.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameState.gameActive = false;
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }

            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            if (isMobile) {
                document.getElementById('joystick-zone').style.display = 'none';
            } else {
                controls.unlock();
            }
            showResults();
        }

        function showResults() {
            const resultModal = document.getElementById('result-modal');
            const resultTitle = document.getElementById('result-title');
            const resultImg = document.getElementById('result-img');
            const resultText = document.getElementById('result-text');
            let title, imageSrc, text;

            if (gameState.score >= 20) {
                title = 'HEBAT!';
                imageSrc = 'assets/hasil1.png';
                text = `Sempurna! Anda berhasil menyebarkan angket ke semua ${gameState.score} rumah! Misi berhasil cek hasilnya!`;
            } else if (gameState.score >= 15) {
                title = 'KERJA BAGUS!';
                imageSrc = 'assets/hasil2.png';
                text = `Bagus! Anda berhasil menyebarkan angket ke ${gameState.score} dari ${gameState.totalPoints} rumah. Cek hasilnya!`;
            } else if (gameState.score >= 10) {
                title = 'USAHA YANG BAGUS!';
                imageSrc = 'assets/hasil2.png';
                text = `Tidak buruk! Anda berhasil menyebarkan angket ke ${gameState.score} dari ${gameState.totalPoints} rumah. Cek hasilnya!`;
            } else if (gameState.score == 0) {
                title = 'Gagal!';
                text = `Anda gagal menyebarkan angket, tidak ada hasil respon dari warga.`;
            } else {
                title = 'LUMAYAN!';
                imageSrc = 'assets/hasil3.png';
                text = `Anda berhasil menyebarkan angket ke ${gameState.score} dari ${gameState.totalPoints} rumah. Cek hasilnya!`;
            }

            resultTitle.textContent = title;
            resultImg.src = imageSrc;
            resultText.textContent = text;
            resultModal.style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('start-modal').style.display = 'flex';
        }

        function goBack() {
            window.location.href = 'index1.html';
        }

        function downloadResult() {
            const resultImg = document.getElementById('result-img');
            const link = document.createElement('a');
            link.href = resultImg.src;
            const filename = resultImg.src.split('/').pop() || 'hasil-misi.png';
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function playClickSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (error) {
                console.warn('Audio not supported');
            }
        }
        
        document.addEventListener('DOMContentLoaded', function () {
            console.log('🎯 Three.js Misi Angket System Initialized');
            init();
            
            const resultImg = document.getElementById('result-img');
            const zoomOverlay = document.getElementById('zoom-overlay');
            const zoomedImg = document.getElementById('zoomed-img');
            resultImg.addEventListener('click', function () {
                zoomedImg.src = this.src;
                zoomOverlay.style.display = 'flex';
            });
        });
    </script>
</body>
</html>
